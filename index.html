<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Good.ia - Seu Incentivador Pessoal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Good.ia</h1>
  <p class="tagline">Leve leveza, positividade e amor próprio para o seu dia.</p>

  <div class="controls">
    <label for="frequency">Frequência das mensagens:</label>
    <select id="frequency">
      <option value="3600000">1x por hora</option>
      <option value="28800000">3x ao dia</option>
      <option value="86400000">1x por dia</option>
    </select>
    <button id="start">Iniciar</button>
  </div>

  <div class="message-box" id="messageBox">Clique em iniciar para receber um incentivo.</div>

  <button id="sos">Preciso de um incentivo agora</button>

  <section class="news">
    <h2>Boas Notícias</h2>
    <ul id="newsList"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
